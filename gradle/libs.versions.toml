# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
[versions]
aws-sdk = "2.44.13"
assertj = "3.27.7"
mockk= "1.14.9"
junit-jupiter = "6.1.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.3.21" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
researchgate-release = { id = "net.researchgate.release", version = "3.1.0" }

[libraries]
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-codeartifact = { module = "software.amazon.awssdk:codeartifact" }
aws-sts = { module = "software.amazon.awssdk:sts" }
aws-sso = { module = "software.amazon.awssdk:sso" }

# Testing libraries
kotlin-tests = { module = "org.jetbrains.kotlin:kotlin-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }